name: puntocelltienda-v2

services:
  db-v2:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: puntocell_db_v2
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1436:1433"
    volumes:
      - db_data_v2:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  db-init-v2:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: puntocell_db_init_v2
    depends_on:
      db-v2:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    volumes:
      - ./db/init:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/opt/mssql-tools18/bin/sqlcmd -S db-v2 -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /init/init.sql && /opt/mssql-tools18/bin/sqlcmd -S db-v2 -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /init/seed_engine.sql"
    restart: "no"

  api-v2:
    build:
      context: ./PuntoCell_API
    container_name: puntocell_api_v2
    restart: unless-stopped
    environment:
      PORT: 3000
      PUBLIC_FRONT_URL: ${PUBLIC_FRONT_URL:-http://localhost:5176}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3003}
      PUBLIC_DB_PORT: ${PUBLIC_DB_PORT:-1436}
      NODE_ENV: development
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5176}
      DB_DIALECT: mssql
      DB_HOST: db-v2
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: sa
      DB_PASSWORD: ${DB_SA_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      EMAIL_PORT: 587
      EMAIL_USER: ${EMAIL_USER}
      SMTP_PASS: ${SMTP_PASS}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_BACK_URL_BASE: ${MP_BACK_URL_BASE:-http://localhost:5176}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-}
      MP_ID_EMPLEADO: ${MP_ID_EMPLEADO:-}
      MP_ID_TURNO_CAJA: ${MP_ID_TURNO_CAJA:-}
      MP_ID_METODO_PAGO: ${MP_ID_METODO_PAGO:-}
      RECAPTCHA_API_KEY: ${RECAPTCHA_API_KEY:-}
      RECAPTCHA_PROJECT_ID: ${RECAPTCHA_PROJECT_ID:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME}
      MOBILEAPI_KEY: ${MOBILEAPI_KEY:-}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-true}
    ports:
      - "3003:3000"
    volumes:
      - ./PuntoCell_API:/app
      - api_node_modules_v2:/app/node_modules
    depends_on:
      db-init-v2:
        condition: service_completed_successfully

  front-v2:
    build:
      context: ./PuntoCell_WebPage
    container_name: puntocell_front_v2
    environment:
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
      PUBLIC_FRONT_URL: ${PUBLIC_FRONT_URL:-http://localhost:5176}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api-v2:3000}
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_CATALOGO_IMAGES_URL: ${VITE_CATALOGO_IMAGES_URL:-}
    ports:
      - "5176:5173"
    volumes:
      - ./PuntoCell_WebPage:/app
      - front_node_modules_v2:/app/node_modules
    depends_on:
      - api-v2

volumes:
  db_data_v2:
  api_node_modules_v2:
  front_node_modules_v2:
